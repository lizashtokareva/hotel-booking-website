{% extends 'base.html' %}

{% block content %}
<h1>{{ title|capfirst }}</h1>

<ul>
    {% for h in hotels %}
            <li>
                <h2>{{ h.title }}</h2>
                <p>{{h.content | linebreaks|  truncatewords:50}}</p>
                <p><a href="{{ h.get_absolute_url }}">Читать описание</a></p>
                {% if not forloop.last %}
                <hr>
                {%endif%}
            </li>

    {% endfor %}

</ul>

{% endblock %}
